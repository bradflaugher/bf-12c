name: Build and release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One release pipeline at a time; never cancel a run that may be
# mid-way through replacing the published release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Secrets only ever reach builds of main (never PRs or a manual dispatch
    # of another branch), so branch build logic can't read them.
    env:
      SIGNED: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Date-labeled versions: 2026.09.24.<run>. The run number keeps the
      # versionCode increasing so sideloaded updates install over the old APK.
      - name: Compute version
        id: version
        run: |
          version="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'BF12C_VERSION_NAME=%s\nBF12C_VERSION_CODE=%s\n' "$version" "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # API 37 platforms install as platforms;android-37.0 (not android-37).
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Restore signing keystore
        if: env.SIGNED == 'true'
        env:
          BF12C_KEYSTORE_BASE64: ${{ secrets.BF12C_KEYSTORE_BASE64 }}
          BF12C_STORE_PASSWORD: ${{ secrets.BF12C_STORE_PASSWORD }}
          BF12C_KEY_ALIAS: ${{ secrets.BF12C_KEY_ALIAS }}
          BF12C_KEY_PASSWORD: ${{ secrets.BF12C_KEY_PASSWORD }}
        run: |
          missing=()
          for variable in BF12C_KEYSTORE_BASE64 BF12C_STORE_PASSWORD BF12C_KEY_ALIAS BF12C_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              missing+=("$variable")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/bf12c-release.jks"
          printf '%s' "$BF12C_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [ ! -s "$keystore_path" ]; then
            printf 'The restored signing keystore is empty\n' >&2
            exit 1
          fi
          printf 'BF12C_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      # Signing is all-or-nothing in app/build.gradle.kts. Pull requests get no
      # signing variables at all and build a clean unsigned APK (so do manual
      # runs of other branches).
      - name: Lint, test, and build release APK and bundle
        env:
          BF12C_STORE_PASSWORD: ${{ env.SIGNED == 'true' && secrets.BF12C_STORE_PASSWORD || '' }}
          BF12C_KEY_ALIAS: ${{ env.SIGNED == 'true' && secrets.BF12C_KEY_ALIAS || '' }}
          BF12C_KEY_PASSWORD: ${{ env.SIGNED == 'true' && secrets.BF12C_KEY_PASSWORD || '' }}
        run: ./gradlew lint test assembleRelease bundleRelease

      # The APK is for sideloading; the bundle (.aab) is what Google Play takes,
      # and the R8 mapping deobfuscates Play crash reports. Pull requests upload
      # the unsigned APK only.
      - name: Name signed APK, bundle and mapping
        if: env.SIGNED == 'true'
        run: |
          mkdir -p dist
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          mv "$apk" dist/bf-12c.apk
          mv app/build/outputs/bundle/release/*.aab dist/bf-12c.aab
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt

      - name: Name APK
        if: env.SIGNED != 'true'
        run: |
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          mv "$apk" app/build/outputs/apk/release/bf-12c.apk

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bf-12c-${{ steps.version.outputs.version }}
          path: ${{ env.SIGNED == 'true' && 'dist/' || 'app/build/outputs/apk/release/bf-12c.apk' }}
          if-no-files-found: error

  # Play rejects an edit whose listing breaks its limits, so pull requests
  # check fastlane/metadata (text, image sizes and formats) before it can
  # reach main, and that the locked
  # fastlane still installs on the runner's Ruby.
  store-listing:
    name: store listing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_FROZEN: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_HIDE_CHANGELOG: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pillow decodes every listing image; Ubuntu's own package, so no
      # unpinned download from PyPI.
      - name: Install Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pil

      - name: Check listing text and images against Play's limits
        run: /usr/bin/python3 .github/scripts/check_store_listing.py

      # Native gem extensions are built for the runner's Ruby, so its
      # version is part of the cache key.
      - name: Find Ruby version
        id: ruby
        run: printf 'version=%s\n' "$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"

      - name: Cache fastlane gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-ruby${{ steps.ruby.outputs.version }}-gems-${{ hashFiles('Gemfile.lock') }}

      - name: Install fastlane
        run: |
          sudo gem install bundler --version "$(tail -n 1 Gemfile.lock | tr -d ' ')" --no-document
          bundle install
      - name: Check that fastlane runs
        run: bundle exec fastlane supply --help > /dev/null

  # Every signed main build goes to Google Play's Closed testing - Alpha
  # track, with changelogs/default.txt as its release notes, and the store
  # listing is synced from fastlane/metadata/android: text, icon, feature
  # graphic and screenshots (images Play already has are skipped by
  # checksum). Promotion to production is play-promote.yml, run by hand.
  play:
    name: Google Play
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, store-listing]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PLAY_SERVICE_ACCOUNT_JSON is an environment secret, and only main can
    # deploy to google-play, so no other branch's workflow can read it.
    environment: google-play
    # One Play edit at a time: a promotion and an upload never overlap.
    concurrency:
      group: google-play
      cancel-in-progress: false
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_FROZEN: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_HIDE_CHANGELOG: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed bundle and mapping
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bf-12c-${{ needs.build.outputs.version }}
          path: release

      # Native gem extensions are built for the runner's Ruby, so its
      # version is part of the cache key.
      - name: Find Ruby version
        id: ruby
        run: printf 'version=%s\n' "$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"

      - name: Cache fastlane gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-ruby${{ steps.ruby.outputs.version }}-gems-${{ hashFiles('Gemfile.lock') }}

      - name: Install fastlane
        run: |
          sudo gem install bundler --version "$(tail -n 1 Gemfile.lock | tr -d ' ')" --no-document
          bundle install

      - name: Upload to Closed testing - Alpha
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf 'No PLAY_SERVICE_ACCOUNT_JSON secret in the google-play environment\n' >&2
            exit 1
          fi
          key="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key"
          bundle exec fastlane supply \
            --package_name com.bradflaugher.bf12c \
            --json_key "$key" \
            --aab release/bf-12c.aab \
            --mapping release/mapping.txt \
            --track alpha \
            --release_status completed \
            --metadata_path fastlane/metadata/android \
            --sync_image_upload true

  release:
    name: release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publish the new GitHub release, delete the previous one
      id-token: write # sign the build provenance attestation (OIDC)
      attestations: write # store the attestation

    steps:
      - name: Download signed APK, bundle and mapping
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bf-12c-${{ needs.build.outputs.version }}
          path: release-apk

      # Signed build provenance for the APK and bundle: anyone can check a
      # download came from this repository's CI with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-apk/bf-12c.apk
            release-apk/bf-12c.aab

      # Exactly one release lives at a time: publish the new date-labeled
      # release, then delete every other release and its tag.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"
          cd release-apk
          sha256sum bf-12c.apk | tee bf-12c.apk.sha256

          gh release create "$tag" bf-12c.apk bf-12c.apk.sha256 \
            bf-12c.aab mapping.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "bf-12c ${VERSION}" \
            --notes "Signed build of ${GITHUB_SHA} from $(date -u +%Y-%m-%d). Sideload bf-12c.apk; bf-12c.aab and mapping.txt are for Google Play. Verify with bf-12c.apk.sha256." \
            --latest

          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
          while read -r old_tag; do
            if [ "$old_tag" != "$tag" ]; then
              gh release delete "$old_tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            fi
          done
